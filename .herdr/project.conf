# OnGi project settings for the global Herdr Dev CLI.
PROJECT_NAME="OnGi"
PROJECT_SLUG="ongi"
FRONTEND_DIR="."
FRONTEND_DEV="env VITE_API_BASE_URL=http://100.68.137.42:8080 npm run dev -- --host 100.68.137.42"
FRONTEND_TEST="npm test"
FRONTEND_BUILD="npm run build"
FRONTEND_VERIFY="npm run verify"
FRONTEND_E2E="npm run test:e2e"
FRONTEND_URL="http://100.68.137.42:5173"
BACKEND_DIR="backend"
BACKEND_DEV="if [[ -f ../.env ]]; then set -a; source ../.env; set +a; fi; export ONGI_ALLOWED_ORIGINS=http://localhost:5173,http://100.68.137.42:5173; ./gradlew bootRun"
BACKEND_TEST="./gradlew test"
BACKEND_HEALTH_URL="http://localhost:8080/actuator/health"
DB_START="docker compose up -d postgres"
DB_STOP="docker compose stop postgres"
DB_READY="docker compose exec -T postgres sh -c 'pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"'"
DEPLOY_MODE="github-actions"
DEPLOY_COMMAND=""
DEPLOY_BRANCH="master"
DEPLOY_WORKFLOW="pages.yml"
FRONTEND_PRODUCTION_URL="https://ongi.greengroove.app/"
BACKEND_PRODUCTION_HEALTH_URL="https://ongi-api.greengroove.app/actuator/health/readiness"
REVIEWER_PROMPT=".herdr/reviewer-prompt.txt"
DEFAULT_TEST_PROFILE="full"
WAIT_TIMEOUT_MS="900000"
START_TIMEOUT_SECONDS="120"
DEPLOY_TIMEOUT_SECONDS="1800"
